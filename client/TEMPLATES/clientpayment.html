{% extends 'headers.html' %}
{% load static %}
{% load mathfilters %}
{% block content %} 
<script>
  document.addEventListener("DOMContentLoaded", function () {
      const baseAmount = 500;  // Base maintenance charge
      const lateFee = 50;      // Late payment charge
      const currentMonth = new Date().getMonth() + 1; // Get current month (1-12)
      const monthSelect = document.getElementById("month");
      const amountInput = document.querySelector("input[name='amount']");
      let razorpayScript = document.querySelector("script[src^='https://checkout.razorpay.com']");

      function updateAmount() {
          let selectedMonth = parseInt(monthSelect.value);
          let finalAmount = baseAmount;

          // If selected month is before the current month, add ₹50 late fee
          if (selectedMonth < currentMonth) {
              finalAmount += lateFee;
          }

          // Update the hidden input field for amount
          amountInput.value = finalAmount;

          // Update Razorpay script dynamically
          if (razorpayScript) {
              let newScript = document.createElement("script");
              newScript.src = "https://checkout.razorpay.com/v1/checkout.js";
              newScript.dataset.key = "rzp_test_2jqOBolRZODUOm";
              newScript.dataset.amount = finalAmount * 100; // Convert to paise
              newScript.dataset.currency = "INR";
              newScript.dataset.order_id = "{{payment.id}}";
              newScript.dataset.buttontext = "Pay with Razorpay";
              newScript.dataset.name = "Nexus13";
              newScript.dataset.url_root = "https://eneqd3r9zrjok.x.pipedream.net/";
              newScript.dataset.description = "Maintenance Payment";
              newScript.dataset.image = "/client_static/assets/images/shop/logo2.png";
              newScript.dataset.prefillName = "vedang";
              newScript.dataset.prefillEmail = "gajjardhruv0009@gmail.com";
              newScript.dataset.themeColor = "#F37254";

              // Remove old script and add new script
              razorpayScript.remove();
              document.body.appendChild(newScript);
              razorpayScript = newScript;
          }
      }

      // Add event listener to dropdown
      monthSelect.addEventListener("change", updateAmount);

      // Initialize amount on page load
      updateAmount();
  });
</script>

  

<section id="agent-2-peperty" class="profile padding ">

<div class="col-sm-9 col-md-9">
<div class="info-block" id="payment">
