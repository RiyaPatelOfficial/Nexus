    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link id="color" rel="stylesheet" href="{% static 'css/color-1.css' %}" media="screen">

  <body>
    <!-- tap on top starts-->
    <div class="tap-top"><i class="iconly-Arrow-Up icli"></i></div>
    <!-- tap on tap ends-->
    <!-- loader-->
    <div class="loader-wrapper">
      <div class="loader"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <!-- login page start-->
    <div class="container-fluid"> 
      <div class="row">
        <div class="col-12 p-0">
          <div class="login-card login-dark">
            <div>
              <!-- <div><a class="logo text-center" href="{% static 'index.html' %}"><img class="img-fluid for-light m-auto" src="images/logo/logo1.png" alt="looginpage"><img class="img-fluid for-dark" src="images/logo/logo-dark.png" alt="logo"></a></div> -->
              <div class="login-main"> 
                <form class="theme-form" method="post">
                  {% csrf_token %}
                  <h2 class="text-center">Housing Maintenance Service</h2>
                  <h4 class="text-center">Security Side</h4>
                  <br>
                  <h2 class="text-center">Sign in to account</h2>
                  <p class="text-center">Enter your email &amp; password to login</p>
                  <div class="form-group">
                    <label class="col-form-label">Email Address</label>
                    <input class="form-control" type="email" required="" value="{{cookie_email}}"  name="email" placeholder="Test@gmail.com">
                  </div>
                  <div class="form-group">
                    <label class="col-form-label">Password</label>
                    <div class="form-input position-relative">
                      <input class="form-control" type="password" name="password" required="" value="{{cookie_pass}}" placeholder="*********">
                      <div class="show-hide"><span class="show">                         </span></div>
                    </div>
                  </div>
                  <div class="form-group mb-0 checkbox-checked">
                    <div class="form-check checkbox-solid-info">
                      <input class="form-check-input" id="solid6" name="remember" type="checkbox">
                      <label class="form-check-label" for="solid6">Remember password</label>
                    <!-- </div><a class="link" href="/forget/">Forgot password?</a> -->
                    <br/>
                    <a class="link"  style="color: red;">
                    {% for data in messages %}
                        
                    {{data}}
                    
                    {% endfor %}
                    </a>
                    <div class="text-end mt-3">
                      <button class="btn btn-primary btn-block w-100" type="submit">Sign in</button>
                    </div>
                  </div>
                  <!-- <div class="login-social-title">
                    <h6>Or Sign in with</h6>
                  </div>
                  <div class="form-group">
                    <ul class="login-social">
                      <li><a href="{% static 'https://www.linkedin.com/' %}" target="_blank"><i class="icon-linkedin"></i></a></li>
                      <li><a href="{% static 'https://twitter.com/' %}" target="_blank"><i class="icon-twitter"></i></a></li>
                      <li><a href="{% static 'https://www.facebook.com/' %}" target="_blank"><i class="icon-facebook"></i></a></li>
                      <li><a href="{% static 'https://www.instagram.com/' %}" target="_blank"><i class="icon-instagram"></i></a></li>
                    </ul>
                  </div> -->
                  <!-- <p class="mt-4 mb-0 text-center">Don't have account?<a class="ms-2" href="/signup/">Create Account</a></p> -->
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- jquery-->
      <script src="{% static 'js/vendors/jquery/jquery.min.js' %}"></script>
      <!-- bootstrap js-->
      <script src="{% static 'js/vendors/bootstrap/dist/js/bootstrap.bundle.min.js' %}" defer=""></script>
      <script src="{% static 'js/vendors/bootstrap/dist/js/popper.min.js' %}" defer=""></script>
      <!--fontawesome-->
      <script src="{% static 'js/vendors/font-awesome/fontawesome-min.js' %}"></script>
      <!-- password_show-->
      <script src="{% static 'js/password.js' %}"></script>
      <!-- custom script -->
      <script src="{% static 'js/script.js' %}"></script>
    </div>
