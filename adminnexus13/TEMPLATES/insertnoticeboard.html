{% extends 'header.html' %}
{% load static %}
{% block content %}
<script
      src="https://code.jquery.com/jquery-3.7.0.js"
      integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
      crossorigin="anonymous">
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/parsley.js/2.9.2/parsley.js"></script>

<style>
.parsley-errors-list {
    color:RED;
}
</style>
<div class="page-body">
  <div class="container-fluid">
    <div class="page-title">
      <div class="row">
        
      </div>
    </div>
  </div>
  <!-- Container-fluid starts-->
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-header card-no-border pb-0">
            <h3>ADD Notice</h3>
           
          </div>
          <div class="card-body">
            <!-- form start -->
            <form class="row g-3 needs-validation custom-input tooltip-valid validation-forms" method="post" novalidate="" data-parsley-validate >
              {% csrf_token %}
               <div class="col-xl-6">
                <div class="card">
                  <div class="card-body">
                    <form class="row g-3 needs-validation custom-input validation-forms" novalidate="">
                      <div class="col-12">
                        <label class="form-label" for="validationCustom01">title</label>
                        <input class="form-control " id="validationCustom01" name="title" type="text" placeholder="title" required data-parsley-required-message="Notice Title is required">
                        <div class="invalid-feedback">Please enter your valid</div>
                        <div class="valid-feedback">
                           Looks's Good! </div>
                          </div>
                      <div class="col-12">
                        <label class="form-label" for="validationCustom01">description</label>
                        
                        <input class="form-control " id="validationCustom01" name="description" type="text" placeholder="details of Notice" required data-parsley-required-message="Notice Description is required" data-parsley-minlength="250">
                        <input class="form-control" hidden value="{{current_date}}" name="notice_date" type="datetime-local" >
                        <div class="invalid-feedback">Please enter your valid</div>
                        <div class="valid-feedback">
                           Looks's Good! </div>
                          </div>
                         <div class="col-12 mt-2"> 
                    <button class="btn btn-primary" type="submit">Submit form</button>
                </div>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
