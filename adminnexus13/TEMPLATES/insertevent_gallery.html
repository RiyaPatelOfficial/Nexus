{% extends 'header.html' %}
{% load static %}
{% block content %}
<script
      src="https://code.jquery.com/jquery-3.7.0.js"
      integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
      crossorigin="anonymous">
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/parsley.js/2.9.2/parsley.js"></script>

<style>
.parsley-errors-list {
    color:RED;
}
</style>
<div class="page-body">
  <div class="container-fluid">
    <div class="page-title">
      <div class="row">
        
      </div>
    </div>
  </div>
  <!-- Container-fluid starts-->
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-header card-no-border pb-0">
            Add image and event
          <div class="card-body">
            <!-- form start -->
            <form class="row g-3 needs-validation custom-input tooltip-valid validation-forms" method="post" enctype="multipart/form-data" novalidate="" data-parsley-validate >
              {% csrf_token %}

               <div class="col-xl-6">
                <div class="card">
                  <div class="card-header card-no-border pb-0">
                     
                  <div class="card-body">
                    <form class="row g-3 needs-validation custom-input validation-forms" novalidate="">
                      <div class="col-md-3 position-relative">
                        <label class="form-label" for="validationTooltip04">select event</label>
                        <select class="form-select" name="event_id" id="validationTooltip04" required data-parsley-required-message="event_name required" >
                          {% for data in ev %} 
                        <option value="{{data.event_id}}">{{data.event_name}}</option>
                        {% endfor %}
                        </select>
                        <div class="invalid-tooltip">Please select a valid state.</div>
                        <br/>
                      </div>
                      <div class="col-md-3 position-relative">
                      <img src="" height="200" width="200" name="output" id="output" style="margin-left: 2px;border-radius: 5px 5px 5px 5px;"/><br><br>
                      </div>  
                      <div class="col-12">
                            <label class="form-label" for="validationCustom01">enter your img path</label>
                            <input class="form-control " id="validationCustom01" name="img_path" type="file" placeholder="Please enter your image" required accept="image/*" onchange="loadFile(event)">
                          </div>
                          <script>
                              function loadFile(event){
                                  document.getElementById('output').src=
                                  URL.createObjectURL(event.target.files[0]); 
                              }
                          </script>
                            <div class="invalid-feedback">Please enter your valid</div>
                            <div class="valid-feedback">
                               Looks's Good! </div>
                              </div>
                        
              <div class="col-12 mt-2">
                <button class="btn btn-primary" type="submit">Submit form</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
