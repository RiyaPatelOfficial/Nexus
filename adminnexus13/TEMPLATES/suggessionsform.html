{% extends 'header.html' %}
{% load static %}
{% block content %}
<script
      src="https://code.jquery.com/jquery-3.7.0.js"
      integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
      crossorigin="anonymous">
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/parsley.js/2.9.2/parsley.js"></script>

<style>
.parsley-errors-list {
    color:RED;
}
</style>
<div class="page-body">
  <div class="container-fluid">
    <div class="page-title">
      <div class="row">
        
      </div>
    </div>
  </div>
  <!-- Container-fluid starts-->
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-header card-no-border pb-0">
           
          </div>
          <div class="card-body">
            <!-- form start -->
            <form class="row g-3 needs-validation custom-input tooltip-valid validation-forms" method="post" novalidate="" data-parsley-validate>
              {% csrf_token %}

               <div class="col-xl-6">
                <div class="card">
                  <div class="card-header card-no-border pb-0">
                    <h3>Add suggession</h3>
            
                  </div>
                  <div class="card-body">
                    <form class="row g-3 needs-validation custom-input validation-forms" novalidate="">
                        <div class="col-12">
                             <label class="form-label" for="validationCustom01">description</label>
                             <input class="form-control " id="validationCustom01" name="description" type="text" placeholder="Please enter your suggestion" required data-parsley-required-message="enter description is required">
                             <div class="invalid-feedback">Please enter your valid</div>
                             <div class="valid-feedback">
                               Looks's Good! </div>
                              </div>
                              <div class="col-md-3 position-relative">
                                <label class="form-label" for="validationTooltip04">Suggession BY</label>
                                <input class="form-control " id="validationCustom01" name="suggested_by" type="text" placeholder="suggested_by" hidden value="{{request.session.adminid}}">
                               
                                <div class="invalid-tooltip">Please select a valid state.</div>
                              </div>
                              
                              <!-- <label class="form-label" for="validationCustom01">Suggession BY</label>
                              <select name="suggested_by">
                                {% for data in hsmember %}
                                <option value="{{data.member_id}}">{{data.member_id.name}}</option>
                                {% endfor %}
                            </select> -->
                       
              <div class="col-12 mt-2">
                <button class="btn btn-primary" type="submit">Submit form</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
