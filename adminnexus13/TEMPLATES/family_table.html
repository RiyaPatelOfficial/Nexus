{% extends 'header.html' %}
{% load static %}
{% block content %}
        <div class="page-body">
          <div class="container-fluid">
            <div class="page-title">
              <div class="row">
              </div>
            </div>
          </div>
          <!-- Container-fluid starts-->
          <div class="col-sm-12">
            <div class="card">
              <div class="card-header pb-0 card-no-border">
                <h3>HTML5 Export Buttons</h3>
              </div>
              <div class="card-body">
                <div class="dt-ext table-responsive">
                  <table class="display" id="export-button">
                    <thead>
                      <tr>
                        <th>family_id</th>
                        <th>name</th>
                        <th>member_name</th>
                        <!-- <th>contact</th> -->
                        <th>relationship</th>
                        <th>contact</th>
                      </tr>
                    </thead>
                    <tbody>
                      {% for data in e %}
                       <tr>
                        <td>{{data.family_id}}</td>
                        <td>{{data.member_id.name}}</td>  
                        <td>{{data.member_name}}</td>
                        <td>{{data.relationship}} </td>
                        <td>{{data.contact}}</td>
                        <!-- <td> 
                          <ul class="action"> 
                            <li class="edit"> <a href="#"><i class="icon-pencil-alt"></i></a></li>
                            <li class="delete"><a href="#"><i class="icon-trash"></i></a></li>
                          </ul>
                        </td> -->
                      </tr>
                      {% endfor %}
                    </tbody>
                   </table>
                </div>
              </div>     
            </div>
          </div>
          <!-- Container-fluid Ends                 -->
        </div>
{% endblock %}
